name: Cron Probe

# TEMPORARY probe: confirms GitHub fires the `schedule` trigger on this
# standalone repo. Deleted once the result is known.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stamp
        run: echo "cron probe ran at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
